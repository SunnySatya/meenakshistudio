services:
  - type: web
    name: meenakshistudio
    runtime: node
    plan: free
    # Build from the server directory
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        sync: false
      - key: NODE_ENV
        value: production
